[package]
name = "cl-backend"
version = "0.1.0"
edition = "2024"

[profile.dev.package.sqlx-macros]
opt-level = 3

[dependencies]
aws-lc-rs = "=1.18.0"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
dotenvy = "=0.15.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "uuid", "migrate"] }
tokio = { version = "=1.53.1", features = ["full"] }
tower-http = { version = "=0.7.0", features = ["cors", "set-header"] }
uuid = { version = "=1.24.1", features = ["serde", "v4"] }
thiserror = "=2.0.20"
redis = { version = "=1.6.0", features = ["tokio-comp"] }
utoipa = { version = "=5.5.0", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum", "vendored"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "time"] }
argon2 = "=0.6.0-rc.8"
password-hash = { version = "=0.6.1", features = ["phc", "getrandom"] }
getrandom = "=0.4.3"
time = "=0.3.55"
cookie = "=0.18.2"
password_policy = "=0.1.0"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "aws-lc-rs"] }
base64 = "=0.23.1"
hmac = "=0.13.0"
sha2 = "=0.11.0"
icalendar = "=0.17.13"
chrono-tz = "=0.10.4"
