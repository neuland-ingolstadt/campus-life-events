name: BackendCI Tests

on:
  pull_request:
    branches: [ 'main' ]
    paths:
      - "backend/src/**"
      - "backend/tests/**"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/migrations/**"

jobs:
  test:
    name: Run Cargo Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      
      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cargo/bin
            ~/.rustup
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}-clippy-${{ hashFiles('backend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}-clippy-
            ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      
      - name: Run cargo fmt
        run: SQLX_OFFLINE=true cargo fmt --all -- --check
      
      - name: Run cargo clippy (zero warnings policy)
        run: SQLX_OFFLINE=true cargo clippy --all-targets --all-features -- -D warnings
      